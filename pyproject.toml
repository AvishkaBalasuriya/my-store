[project]
name = "my-store"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.5",
    "email-validator>=2.3.0",
    "pydantic-extra-types[pendulum]>=2.11.1",
    "pycountry>=26.2.16",
]

[dependency-groups]
dev = [{ include-group = "lint" }, { include-group = "security" }]
lint = ["black>=26.5.1", "isort>=9.0.2", "ruff>=0.16.9"]
security = ["detect-secrets>=1.5.0"]

[tool.black]
line-length = 90
target-version = ["py314"]

[tool.ruff]
src = ["app/src/"]
line-length = 90
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PIE", "RET"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["app/"]
testpaths = ["app/tests/"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["app/src/"]

[tool.coverage.report]
show_missing = true
skip_covered = true
